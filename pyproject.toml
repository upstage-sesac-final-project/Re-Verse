[project]
name = "re-verse"
version = "0.1.0"
description = "AI-powered RPG game creation tool using natural language"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "supabase>=2.7.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langsmith>=0.1.0",
    "langchain-upstage>=0.7.7",
    "langchain-chroma>=1.1.0",
    "sentence-transformers>=5.3.0",
    "langchain-text-splitters>=1.1.1",
    "boto3>=1.42.77",
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.3.3",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "email-validator>=2.1.0",
    "mcp>=1.26.0",
    "ijson>=3.3.0",
    "torch>=2.0.0,<2.6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.5.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "uv.lock",
    "app/frontend",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
exclude = ["app/frontend", "storage"]
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "backend.*"
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/backend/tests", "agent/tests"]
markers = ["integration: 실제 LLM API 호출이 필요한 통합 테스트 (API 키 필요)"]

[tool.coverage.run]
source = ["agent", "app/backend"]
omit = [
    "agent/tests/*",
    "app/backend/tests/*",
    "*/check_*.py",
    "*/integration_*_test.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "app/backend", "shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
