# Re:Verse - EC2 프로덕션 배포용 (백엔드만)
# 프론트엔드는 Vercel에서 별도 배포
# 사용: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"  # EC2에서 외부 접근 허용
    env_file: .env.production
    environment:
      - APP_ENV=production
      - ENVIRONMENT=production
      - DEBUG=false
      # STORAGE_BACKEND, DATABASE_URL, S3_* 는 EC2의 .env.production(또는 GitHub ENV_FILE)에서 주입 권장
    volumes: []  # 프로덕션에서는 볼륨 마운트 제거 (override)
    restart: unless-stopped
    stop_grace_period: 30s  # shutdown hook이 S3 업로드할 시간 확보

    # 단일 호스트 `docker compose up`에서는 deploy.resources가 적용되지 않음(Swarm 전용).
    # EC2 일반 Compose 실행에 맞춰 아래 제한을 사용합니다.
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 512

    # 로그 설정
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # nginx reverse proxy (선택사항 - HTTPS/도메인 설정 시)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/ssl:/etc/ssl:ro  # SSL 인증서 (필요시)
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - nginx  # 'docker compose --profile nginx up'으로만 실행됨
